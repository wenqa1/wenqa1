name: Stats Cards
on:
  schedule: [{cron: "0 0 * * *"}]
  push: {branches: ["main"]}
  workflow_dispatch:
jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Stats Cards
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=wenqa1&show_icons=true&locale=cn&bg_color=00000000&hide_border=true" > github-stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs?username=wenqa1&layout=donut&locale=cn&bg_color=00000000&hide_border=true" > github-top-langs.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-top-langs.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stats cards [skip ci]"
          git push
